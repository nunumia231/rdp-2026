name: RDP 2026

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale Auth key"
        required: true

permissions:
  contents: read
  actions: write

jobs:
  full:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: MasumHub
      RDP_PASS: Masum2017
      MAIN_RUNTIME_MIN: 360

    steps:
      - name: Show runner info
        shell: pwsh
        run: |
          whoami
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

      # ---------------- TAILSCALE ----------------
      - name: Install and Configure Tailscale
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "tailscale.msi"
            Start-Process msiexec.exe -ArgumentList "/i tailscale.msi /quiet /norestart" -Wait
            Start-Sleep -Seconds 10
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & $exe up --authkey "${{ inputs.ts_authkey }}" --hostname "bullet" --accept-routes --reset

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
            $ip = & $exe ip -4 | Select-Object -First 1
            if ($ip) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $ip) { throw "Tailscale IP not found" }

          echo "TS_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      # ---------------- RDP USER SETUP ----------------
      - name: Create RDP User and Configure
        shell: pwsh
        run: |
          $User = $env:RDP_USER
          $Pass = $env:RDP_PASS

          $sec = ConvertTo-SecureString $Pass -AsPlainText -Force

          if (-not (Get-LocalUser $User -ErrorAction SilentlyContinue)) {
            New-LocalUser $User -Password $sec -FullName "RDP User" -Description "GitHub RDP"
            Add-LocalGroupMember -Group "Administrators" -Member $User
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $User
            Write-Host "New user created: $User"
          } else {
            Set-LocalUser -Name $User -Password $sec
            Write-Host "User password updated"
          }

          # Enable RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Important: Allow multiple sessions + reset existing sessions
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0

          Write-Host "RDP User: $User"
          Write-Host "RDP Password: $Pass"

      # ---------------- KEEP ALIVE ----------------
      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "Keeping session alive for 6 hours..."
          Start-Sleep -Seconds 21600

      - name: Final Connection Info
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "✅ SETUP COMPLETED!"
          Write-Host "RDP Username : $($env:RDP_USER)"
          Write-Host "RDP Password : $($env:RDP_PASS)"
          Write-Host "Tailscale IP : $($env:TS_IP)"
          Write-Host ""
          Write-Host "Connect using RDP to: $($env:TS_IP)"
          Write-Host "Use username: MasumHub"
          Write-Host "======================================"
